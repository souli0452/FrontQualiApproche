<div class="card-first overflow-hidden border-none premium-hub transition-colors duration-300">
    <!-- Header Premium -->
    <div class="pb-5 flex flex-col border-b border-surface-border">
        <div class="flex items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold m-0 text-surface-900 dark:text-surface-50 flex items-center gap-3">
                    Gestion des utilisateurs
                </h1>
                <p class="text-surface-500 dark:text-surface-400 mt-1 mb-0">Ajoutez ou modifiez les utilisateurs habilités à utiliser la plateforme, et définissez leurs accès.</p>
            </div>
        </div>
        <div>
            <p-breadcrumb [home]="home" [model]="items" />
        </div>
    </div>

<app-crud-generic
    [dialogWidth]="'40rem'"
    [addButtonLabel]="'Nouvel utilisateur'"
    [pageLabel]="pageLabel"
    [tableCols]="tableCols"
    [listeObject]="dataList"
    [formGroup]="formGroup"
    [formCols]="formCols"
    [loading]="loading"
    [closeDialog]="closeDialog"
    [formHeader]="formHeader"
    [dropdownList]="dropdownList"
    [multiSelectList]="multiSelectList"
    [customButtons]="customButtons"
    (customActionEvent)="handleCustomAction($event)"
    (newItemEvent)="onSave($event)"
    [notDelete]="true"
    [totalElements]="totalElements"
    [isPagination]="false"
    [currentPage]="currentPage"
    [pageSize]="pageSize"
    (pageChangeEvent)="onPageChange($event)"
    >
</app-crud-generic>

</div>
