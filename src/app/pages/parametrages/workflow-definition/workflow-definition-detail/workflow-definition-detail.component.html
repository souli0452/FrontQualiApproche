@if (workflow(); as wf) {
    <div class="card">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-4">
                <p-button icon="pi pi-arrow-left" [text]="true" [rounded]="true"
                          routerLink="/immatriculation/cg-workflow" />
                <div>
                    <h2 class="text-2xl font-semibold mb-1">Détails du workflow</h2>
                    <span class="text-surface-500">{{ wf.libelle }}</span>
                </div>
            </div>
            <div class="flex gap-2">
                <p-button
                    label="Modifier"
                    icon="pi pi-pencil"
                    severity="secondary"
                    [routerLink]="['/immatriculation/cg-workflow', wf.id, 'edit']" />
            </div>
        </div>

        <app-workflow-detail [workflow]="wf" />
    </div>
} @else if (loading()) {
    <div class="card flex justify-center py-10">
        <i class="pi pi-spin pi-spinner text-4xl text-primary-500"></i>
    </div>
} @else {
    <div class="card flex flex-col items-center gap-2 py-12 text-surface-400">
        <i class="pi pi-inbox text-4xl"></i>
        <span>Workflow introuvable</span>
    </div>
}
