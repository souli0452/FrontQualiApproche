<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<!-- L'écran d'édition expose la totalité du contrat du serveur, mais les libellés d'aide sous les
     champs ne peuvent pas dire ce que chaque réglage produit, ni ce que le serveur fait à sa place
     quand il est laissé vide. Le guide le dit, dans l'ordre de l'écran. -->
<div class="flex justify-end mb-3">
    <p-button label="Comprendre la configuration d'un circuit" icon="pi pi-question-circle"
              size="small" [text]="true" (onClick)="guideOuvert = true"></p-button>
</div>

<app-workflow-configuration-guide [(visible)]="guideOuvert"></app-workflow-configuration-guide>

@if (typesEnConflit.length) {
    <!-- Informatif, et non plus une alerte : plusieurs circuits actifs sont normaux dès qu'un type
         de document désigne le sien. Ce qui mérite d'être dit est lequel sert de repli. -->
    <div class="flex items-start gap-2 mb-4 p-3 border-round bg-blue-50 text-blue-900 text-sm">
        <i class="pi pi-info-circle mt-0.5"></i>
        <span>
            Plusieurs circuits sont actifs pour {{ typesEnConflit.join(', ') }} : les dossiers qui ne
            désignent pas de circuit — un type de document sans circuit attribué, par exemple —
            prennent le <strong>plus ancien</strong> d'entre eux.
        </span>
    </div>
}

<!-- Tableau générique : même composant que le catalogue d'étapes et que les autres écrans de
     configuration. Les actions passent par son menu de ligne ; la consultation et la saisie sont
     des pages (`circuits/detail/:id`, `circuits/edition/:id`), qu'aucun formulaire générique ne
     saurait décrire (étapes, transitions, champs de saisie). -->
<app-crud-generic [loading]="chargement" [tableCols]="colonnes" [listeObject]="circuits"
                  [pageLabel]="titrePage" [addButtonLabel]="'Nouveau circuit'"
                  [addFilter]="true" [searchField]="filtres" (filterEvent)="filtrerParType($event)"
                  [ajoutExterne]="true" (ajoutDemande)="creerCircuit()"
                  [formGroup]="formulaireTableau" [formCols]="[]" [notModif]="true" [notDelete]="true"
                  [isAffich]="false" [asRoleEdit]="true" [customButtons]="actionsLigne"
                  (customActionEvent)="executerAction($event)"
                  [consultation]="!peutEcrire"
                  [isPagination]="circuits.length > 10">
</app-crud-generic>
