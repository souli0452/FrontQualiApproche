<p-dialog header="Mise à jour du statut du document"
  [visible]="visible" (visibleChange)="visible = $event; visibleChange.emit($event)"
  [modal]="true" [style]="{ width: '50rem' }" [breakpoints]="{ '960px': '75vw', '640px': '90vw' }">

  <form [formGroup]="form" class="p-fluid mt-2" *ngIf="document">
    <div class="grid grid-cols-12 gap-4">

      <div class="col-span-12">
        <div class="flex align-items-center justify-content-between p-3 bg-slate-50 border border-slate-200 border-round gap-3 flex-wrap">
          <div class="flex align-items-center gap-2">
            <span class="text-sm font-bold text-slate-500">Document :</span>
            <span class="text-sm font-bold text-slate-700 flex align-items-center gap-1">
              <i class="pi pi-file text-indigo-500 text-xs"></i>
              {{ document.documentNumber }}
            </span>
          </div>
          <div class="flex align-items-center gap-2">
            <span class="text-sm font-bold text-slate-500">Statut actuel :</span>
            <p-tag [value]="statusLabel(document)" [severity]="statusSeverity(document)" styleClass="text-xs"></p-tag>
          </div>
        </div>
      </div>

      <div class="col-span-12">
        <label class="block text-sm font-bold text-slate-700 mb-1.5">
          Nouveau statut <span class="text-red-500">*</span>
        </label>
        <p-select [options]="transitionOptions" formControlName="nextStatus"
          placeholder="Sélectionner le nouveau statut" class="w-full" appendTo="body"></p-select>
      </div>

      <div class="col-span-12">
        <label class="block text-sm font-bold text-slate-700 mb-1.5">
          Motif / justification <span class="text-red-500">*</span>
        </label>
        <textarea pTextarea formControlName="reason" rows="4"
          placeholder="Motif de ce changement de statut (validation de la version initiale, mise en conformité…)"
          class="w-full"></textarea>
      </div>

    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2 w-full">
      <button pButton label="Annuler" icon="pi pi-times" class="p-button-text p-button-secondary"
        (click)="fermer()"></button>
      <button siLicenceOuverte pButton label="Confirmer la transition" icon="pi pi-check" class="p-button-primary shadow-sm"
        [disabled]="form.invalid" [loading]="loading" (click)="valider()"></button>
    </div>
  </ng-template>
</p-dialog>
