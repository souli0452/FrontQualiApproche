<p-dialog [header]="'Exécuter l\'action : ' + (action?.libelle || '')"
  [visible]="visible" (visibleChange)="visible = $event; visibleChange.emit($event)"
  [modal]="true" [style]="{ width: '40rem' }" [breakpoints]="{ '960px': '75vw', '640px': '90vw' }">

  <div class="p-fluid mt-2" *ngIf="document">
    <div class="p-3 bg-slate-50 border border-slate-200 border-round mb-4 flex align-items-center justify-content-between flex-wrap gap-2">
      <div class="flex align-items-center gap-2">
        <span class="text-sm font-bold text-slate-500">Document :</span>
        <span class="text-sm font-bold text-slate-700">
          <i class="pi pi-file text-indigo-500 mr-1"></i>
          {{ document.documentNumber }}
        </span>
      </div>
      <div class="flex align-items-center gap-2">
        <span class="text-sm font-bold text-slate-500">Action :</span>
        <p-tag [value]="action?.libelle || ''" severity="info" styleClass="text-xs"></p-tag>
      </div>
    </div>

    <form [formGroup]="form" class="p-fluid">
      <label class="block text-sm font-bold text-slate-700 mb-1.5">
        Commentaires / observations <span class="text-red-500">*</span>
      </label>
      <textarea pTextarea formControlName="comments" rows="4"
        placeholder="Motivez votre décision…" class="w-full"></textarea>
      <small class="p-error block mt-1" *ngIf="form.get('comments')?.invalid && form.get('comments')?.touched">
        Un commentaire est requis pour tracer la décision.
      </small>
    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <button pButton label="Annuler" icon="pi pi-times" class="p-button-text p-button-secondary"
        (click)="fermer()"></button>
      <button pButton [label]="'Confirmer ' + (action?.libelle || '')" icon="pi pi-check"
        class="p-button-primary" [disabled]="form.invalid" [loading]="loading"
        (click)="valider()"></button>
    </div>
  </ng-template>
</p-dialog>
