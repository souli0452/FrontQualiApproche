<p-toast></p-toast>

<div class="qms-container p-4">
  <div *ngIf="currentView === 'list'">
    <app-qms-document-list
      [documents]="documents"
      [documentTypes]="documentTypes"
      [structures]="structures"
      [loading]="loading"
      [searchQuery]="searchQuery"
      [selectedType]="selectedType"
      [selectedService]="selectedService"
      [priorites]="priorites"
      [niveauxConfidentialite]="niveauxConfidentialite"
      [domaines]="domaines"
      [selectedPriorite]="selectedPriorite"
      [selectedNiveauConfidentialite]="selectedNiveauConfidentialite"
      [selectedDomaine]="selectedDomaine"
      [statusLabel]="statusLabelFn"
      [statusSeverity]="statusSeverityFn"
      [etapeDeCircuit]="etapeDeCircuitFn"
      [aUneDecisionAttendue]="aUneDecisionAttendueFn"
      [circuitTermine]="circuitTermineFn"
      (searchQueryChange)="searchQuery = $event"
      (selectedTypeChange)="selectedType = $event"
      (selectedServiceChange)="selectedService = $event"
      (selectedPrioriteChange)="selectedPriorite = $event"
      (selectedNiveauConfidentialiteChange)="selectedNiveauConfidentialite = $event"
      (selectedDomaineChange)="selectedDomaine = $event"
      (refresh)="refreshList()"
      (open)="viewDetails($event)">
    </app-qms-document-list>
  </div>
<!-- ========================================================================= -->
<!-- 2. STATE TRANSITION DIALOG -->
<!-- ========================================================================= -->
<app-qms-transition-dialog
  [document]="selectedDocument"
  [transitionOptions]="selectedDocument ? getTransitionOptions(selectedDocument) : []"
  [loading]="loading"
  [statusLabel]="statusLabelFn"
  [statusSeverity]="statusSeverityFn"
  [visible]="showTransitionModal"
  (visibleChange)="showTransitionModal = $event"
  (confirm)="submitTransition($event)">
</app-qms-transition-dialog>

<!-- ========================================================================= -->
<!-- 3. DETAIL PAGE VIEW -->
<!-- =========================================================================
     La permission seule ne suffit pas : sur un document reçu par partage, venu d'une autre
     structure, le serveur refuse l'historique, la piste d'audit et les décisions du circuit.
     `suiviInterneAutorise` est ce qu'il en dit, et l'écran s'y range — mieux vaut pas de bouton
     qu'un bouton qui mène à un refus.
     ========================================================================= -->
<app-qms-document-detail *ngIf="currentView === 'detail' && selectedDocument"
  [document]="selectedDocument"
  [workflowState]="workflowState"
  [canDownload]="hasPermission('document-download')"
  [canViewHistory]="hasPermission('document-history') && selectedDocument.suiviInterneAutorise !== false"
  [canViewAudit]="hasPermission('document-audit') && selectedDocument.suiviInterneAutorise !== false"
  [canValidate]="hasPermission('document-validate') && selectedDocument.suiviInterneAutorise !== false"
  [canShare]="hasPermission('document-write') && selectedDocument.suiviInterneAutorise !== false"
  [canRequestChange]="selectedDocument.suiviInterneAutorise !== false"
  [statusLabel]="statusLabelFn"
  [statusSeverity]="statusSeverityFn"
  [actionIcon]="actionIconFn"
  [actionClass]="actionClassFn"
  (close)="currentView = 'list'"
  (openDocument)="openSecuredDocument($event)"
  (downloadPdf)="downloadSecuredPdf($event)"
  (viewHistory)="viewVersionHistory($event)"
  (viewAudit)="viewAuditLogs($event)"
  (viewValidationHistory)="viewValidationHistory($event)"
  (viewDemandes)="viewDemandes($event)"
  (requestChange)="demanderUneModification($event)"
  (share)="openShareModal($event)"
  (executeAction)="executeDynamicAction($event)">
</app-qms-document-detail>
<!-- ========================================================================= -->
<!-- 4. HISTORIQUE VERSION PAGE VIEW -->
<!-- ========================================================================= -->
<app-qms-document-history *ngIf="currentView === 'history' && selectedDocument"
  [document]="selectedDocument"
  [versionHistory]="versionHistory"
  (close)="currentView = 'list'">
</app-qms-document-history>

<!-- ========================================================================= -->
<!-- 5. PISTE AUDIT PAGE VIEW -->
<!-- ========================================================================= -->
<app-qms-document-audit *ngIf="currentView === 'audit' && selectedDocument"
  [document]="selectedDocument"
  [auditLogs]="auditLogs"
  (close)="currentView = 'list'">
</app-qms-document-audit>

<!-- ========================================================================= -->
<!-- 5 bis. TRAÇABILITÉ DU CIRCUIT DE VALIDATION -->
<!-- Distincte des deux vues ci-dessus : celles-ci portent sur les versions du -->
<!-- fichier et sur les accès, aucune ne disait qui avait validé, ni pourquoi. -->
<!-- ========================================================================= -->
<app-qms-workflow-historique *ngIf="currentView === 'tracabilite' && selectedDocument"
  [document]="selectedDocument"
  [historique]="validationHistory"
  [loading]="loading"
  (close)="currentView = 'list'">
</app-qms-workflow-historique>

<!-- ========================================================================= -->
<!-- 5 quater. DEMANDES PORTÉES SUR LE DOCUMENT                                -->
<!-- Ni les versions, ni les accès, ni les décisions du circuit ne disaient ce  -->
<!-- qu'on avait demandé à son sujet, ni ce qui en avait été décidé.            -->
<!-- ========================================================================= -->
<app-qms-document-demandes *ngIf="currentView === 'demandes' && selectedDocument"
  [document]="selectedDocument"
  [demandes]="demandesDuDocument"
  [loading]="loading"
  (close)="currentView = 'detail'">
</app-qms-document-demandes>

</div>

<!-- ========================================================================= -->
<!-- 6. GESTION DES ACCÈS (ACL) DIALOG -->
<!-- ========================================================================= -->
<app-qms-document-access-dialog
  [document]="selectedDocument"
  [accessList]="accessList"
  [structures]="structures"
  [filteredUsers]="filteredUsers"
  [roleOptions]="roleOptions"
  [loading]="loading"
  [loadingAccess]="loadingAccess"
  [visible]="showShareModal"
  (visibleChange)="showShareModal = $event"
  [partagesStructure]="partagesStructure"
  (structureFilterChange)="onStructureFilterChange($event)"
  (grant)="submitPermissions($event)"
  (revoke)="revokeAccess($event)"
  (partagerAvecStructure)="partagerAvecStructure($event)"
  (retirerPartageStructure)="retirerPartageStructure($event)">
</app-qms-document-access-dialog>

<!-- ========================================================================= -->
<!-- 7. ASSIGNATION WORKFLOW DIALOG -->
<!-- ========================================================================= -->
<app-qms-assign-workflow-dialog
  [document]="selectedDocument"
  [availableWorkflows]="availableWorkflows"
  [loading]="loading"
  [statusLabel]="statusLabelFn"
  [statusSeverity]="statusSeverityFn"
  [visible]="showAssignWorkflowModal"
  (visibleChange)="showAssignWorkflowModal = $event"
  (confirm)="submitWorkflowAssignment($event)">
</app-qms-assign-workflow-dialog>

<!-- ========================================================================= -->
<!-- 8. WORKFLOW STEP DECISION DIALOG -->
<!-- ========================================================================= -->
<app-qms-workflow-decision-dialog
  [document]="selectedDocument"
  [action]="selectedWorkflowAction"
  [loading]="loading"
  [stepFields]="workflowState?.currentStepFields"
  [visible]="showWorkflowModal"
  (visibleChange)="showWorkflowModal = $event"
  (confirm)="submitWorkflowDecision($event)">
</app-qms-workflow-decision-dialog>
