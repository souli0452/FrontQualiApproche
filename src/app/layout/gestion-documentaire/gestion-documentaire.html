<div class="card-first overflow-hidden border-none premium-hub transition-colors duration-300">
    <div class="pb-5 flex justify-between items-center border-b border-surface-border">
        <div class="flex items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold m-0 tracking-tight text-surface-900 dark:text-surface-50 flex items-center gap-3">
                    Gestion Documentaire
                </h1>
                <p class="text-surface-500 dark:text-surface-400 mt-1 mb-0">Cycle de vie, workflows de validation et conformité des documents qualité</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <p-button
                siLicenceOuverte
                label="Nouveau Document"
                icon="pi pi-plus"
                severity="info"
                (click)="navigateToCreate()"/>
        </div>
    </div>

    <div class="bg-surface-0 dark:bg-surface-900 ">
        <p-tabs [value]="activeTab" [scrollable]="true" (valueChange)="onTabChange($event)">
            <p-tablist>
                <p-tab *ngFor="let tab of items" [value]="tab.routerLink">
                    <a [routerLink]="tab.routerLink" routerLinkActive="text-primary font-bold" class="flex items-center gap-2 text-inherit no-underline outline-none px-2 py-1">
                        <i [class]="tab.icon"></i>
                        <span class="whitespace-nowrap">{{ tab.label }}</span>
                    </a>
                </p-tab>
            </p-tablist>
        </p-tabs>
    </div>

    <!-- Zone de Contenu Dynamique -->
    <div class="min-h-[600px]">
        <div class="rounded-xl overflow-hidden py-4">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
