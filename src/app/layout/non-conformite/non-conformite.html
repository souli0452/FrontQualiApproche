<div class="card-first overflow-hidden border-none premium-hub transition-colors duration-300">
    <div class="pb-5 flex justify-between items-center border-b border-surface-border">
        <div class="flex items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold m-0 text-surface-900 dark:text-surface-50 flex items-center gap-3">
                    Gestion des non-conformités
                </h1>
                <p class="text-surface-500 dark:text-surface-400 mt-1 mb-0">Déclaration, analyse, traitement et suivi des écarts qualité</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <p-button
                siLicenceOuverte
                label="Soumettre une NC"
                icon="pi pi-plus" 
                severity="info" 
                routerLink="/non-conformite/declaration"
                styleClass="shadow-sm font-semibold" />
        </div>
    </div>

    <!-- Navigation Hub (Tabs) -->
    <div class="bg-surface-0 dark:bg-surface-900 ">
        <p-tabs [value]="activeTab" [scrollable]="true" (valueChange)="onTabChange($event)">
            <p-tablist>
                <p-tab *ngFor="let tab of items" [value]="tab.routerLink">
                    <a [routerLink]="tab.routerLink" routerLinkActive="text-primary font-bold" class="flex items-center gap-2 text-inherit no-underline outline-none px-2 py-1">
                        <i [class]="tab.icon"></i>
                        <span class="whitespace-nowrap">{{ tab.label }}</span>
                        <p-badge *ngIf="tab.badge" [value]="tab.badge" severity="danger"></p-badge>
                    </a>
                </p-tab>
            </p-tablist>
        </p-tabs>
    </div>

    <!-- Zone de Contenu Dynamique -->
    <div class="min-h-[600px]">
        <div class="rounded-xl overflow-hidden py-4">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
