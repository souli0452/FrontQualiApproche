<div class="card-first overflow-hidden border-none premium-hub transition-colors duration-300">
    <app-header-page 
        title="Gestion des non-conformités" 
        subtitle="Déclaration, analyse, traitement et suivi des écarts qualité"
        [breadcrumbs]="breadcrumbs"
        [buttonText]="'Soumettre une NC'" 
        buttonIcon="pi pi-plus" 
        buttonLink="/non-conformite/declaration" 
    />
    <!-- Navigation Hub (Tabs) -->
    <div class="bg-surface-0 dark:bg-surface-900 ">
        <p-tabs [value]="activeTab" [scrollable]="true" (valueChange)="onTabChange($event)">
            <p-tablist>
                <p-tab *ngFor="let tab of items; trackBy: trackByRouterLink" [value]="tab.routerLink">
                    <div class="flex items-center gap-2 text-inherit no-underline outline-none px-2 py-1 select-none">
                        <i [class]="tab.icon"></i>
                        <span class="whitespace-nowrap">{{ tab.label }}</span>
                        <p-badge *ngIf="tab.badge" [value]="tab.badge" severity="danger"></p-badge>
                    </div>
                </p-tab>
            </p-tablist>
        </p-tabs>
    </div>

    <!-- Zone de Contenu Dynamique -->
    <div class="bg-surface-50/50 dark:bg-surface-950/40 min-h-[500px]">
        <div class="bg-surface-0 dark:bg-surface-900 rounded-xl !overflow-visible">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>

<!-- Popup de Soumission d'une NC -->
<p-dialog 
    [(visible)]="submitNCVisible" 
    [modal]="true" 
    [style]="{ width: '50rem' }"
    [maximizable]="true"
    appendTo="body"
    [header]="'Nouvelle Non-Conformité'"
    styleClass="premium-dialog">
          
    <ng-template pTemplate="header">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-50 dark:bg-red-950/20 rounded-full flex items-center justify-center">
                    <i class="pi pi-exclamation-triangle text-xl text-red-600 dark:text-red-400"></i>
                </div>
                <div>
                    <h5 class="m-0 font-bold text-surface-900 dark:text-surface-50 text-lg">
                        Déclarer une Non-Conformité
                    </h5>
                    <p class="text-xs text-surface-500 dark:text-surface-400 mt-0.5">
                        Renseigner les informations nécessaires pour déclarer un nouvel incident
                    </p>
                </div>
            </div>
        </div>
    </ng-template>

    <!-- <div class="p-1" *ngIf="submitNCVisible">
        <app-nc-compose (closeDialog)="submitNCVisible = false"></app-nc-compose>
    </div> -->
</p-dialog>
