<p-dialog 
    [(visible)]="visible" 
    [modal]="true" 
    [appendTo]="'body'"
    maskStyleClass="backdrop-blur-sm"
    [closable]="false"
    [draggable]="false" 
    [resizable]="false" 
    [style]="{ width: '430px', maxWidth: '92vw' }"
    styleClass="border-none bg-transparent shadow-none overflow-visible">
    
    <ng-template pTemplate="headless">
        <div class="p-6 bg-white dark:bg-surface-900 border border-slate-100 dark:border-surface-800 rounded-2xl shadow-2xl flex flex-col items-center text-center whitespace-normal">
            
            <!-- Badge circulaire corbeille rouge -->
            <div class="w-14 h-14 rounded-full bg-rose-50 dark:bg-rose-950/40 text-rose-500 dark:text-rose-400 flex items-center justify-center mb-3.5 ring-8 ring-rose-50/50 dark:ring-rose-950/20">
                <i class="pi pi-trash text-2xl"></i>
            </div>

            <!-- Titre -->
            <h3 class="text-lg font-bold text-slate-900 dark:text-white m-0 mb-1.5">
                {{ title }}
            </h3>

            <!-- Message explicatif avec retour à la ligne -->
            <p class="text-xs text-slate-500 dark:text-surface-400 m-0 mb-4 leading-relaxed px-1 whitespace-normal break-words">
                {{ message }}
            </p>

            <!-- Encadré avec la valeur à copier -->
            <div class="flex items-center justify-between gap-3 w-full bg-slate-50 dark:bg-surface-800/60 border border-slate-200 dark:border-surface-700 rounded-xl px-3.5 py-2.5 mb-4">
                <span class="font-mono font-bold text-slate-800 dark:text-white text-sm break-all text-left select-all">
                    {{ expectedValue }}
                </span>
                <button 
                    type="button" 
                    (click)="copyToClipboard()"
                    class="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-lg border transition-all cursor-pointer shrink-0"
                    [ngClass]="copied ? 'bg-emerald-50 text-emerald-600 border-emerald-300 dark:bg-emerald-950/50 dark:text-emerald-400 dark:border-emerald-800' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100 dark:bg-surface-800 dark:text-surface-300 dark:border-surface-600'">
                    <i [class]="copied ? 'pi pi-check text-xs' : 'pi pi-copy text-xs'"></i>
                    <span>{{ copied ? 'Copié !' : 'Copier' }}</span>
                </button>
            </div>

            <!-- Champ de saisie -->
            <div class="w-full text-left mb-1">
                <label class="block text-xs font-semibold text-slate-700 dark:text-surface-200 mb-1.5">
                    Saisissez {{ targetLabel }} pour confirmer <span class="text-rose-500">*</span>
                </label>
                <input 
                    pInputText 
                    type="text" 
                    [(ngModel)]="enteredValue" 
                    [placeholder]="'Tapez ' + expectedValue"
                    class="w-full text-sm py-2 px-3 border border-slate-200 dark:border-surface-700 rounded-lg focus:ring-2 focus:ring-rose-500"
                    (keydown.enter)="isMatch && onConfirm()"
                    autofocus />
            </div>

            <!-- Séparateur -->
            <div class="w-full border-t border-slate-100 dark:border-surface-800 my-4"></div>

            <!-- Boutons d'actions -->
            <div class="flex items-center justify-center gap-3 w-full">
                <button 
                    type="button" 
                    pButton 
                    label="Annuler" 
                    class="p-button-outlined p-button-secondary p-button-sm flex-1 justify-center rounded-lg"
                    (click)="onCancel()"
                    [disabled]="loading">
                </button>
                <button 
                    type="button" 
                    pButton 
                    label="Supprimer" 
                    icon="pi pi-trash"
                    class="p-button-danger p-button-sm flex-1 justify-center rounded-lg"
                    (click)="onConfirm()"
                    [disabled]="!isMatch || loading"
                    [loading]="loading">
                </button>
            </div>
        </div>
    </ng-template>
</p-dialog>
