<p-dialog 
    [(visible)]="visible" 
    [modal]="true" 
    [appendTo]="'body'"
    maskStyleClass="backdrop-blur-sm"
    [closable]="false"
    [draggable]="false" 
    [resizable]="false" 
    [style]="{ width: '430px', maxWidth: '92vw' }"
    styleClass="border-none bg-transparent shadow-none overflow-visible">
    
    <ng-template pTemplate="headless">
        <div class="p-6 bg-[var(--surface-card)] border border-[#dddddd] dark:border-surface-700 rounded-[5px] shadow-2xl flex flex-col items-center text-center whitespace-normal">
            
            <!-- Badge circulaire coloré selon la sévérité -->
            <div class="w-14 h-14 rounded-full flex items-center justify-center mb-3.5 ring-8" [ngClass]="badgeClasses">
                <i class="pi !text-2xl" [ngClass]="badgeIcon"></i>
            </div>

            <!-- Titre -->
            <h3 class="text-[17px] font-bold text-[var(--heading-color)] m-0 mb-1.5">
                {{ title }}
            </h3>

            <!-- Message explicatif -->
            <p class="text-[12px] text-[var(--text-color-secondary)] m-0 mb-4 leading-relaxed px-1 whitespace-normal break-words">
                {{ message }}
            </p>

            <!-- Encadré avec la valeur à copier -->
            <div class="flex items-center justify-between gap-3 w-full bg-surface-50 dark:bg-surface-800/60 border border-[#dddddd] dark:border-surface-700 rounded-[5px] px-3.5 py-2.5 mb-4">
                <span class="font-mono font-bold text-[var(--heading-color)] text-[13px] break-all text-left select-all">
                    {{ expectedValue }}
                </span>
                <button 
                    type="button" 
                    (click)="copyToClipboard()"
                    class="flex items-center gap-1.5 text-[12px] font-semibold px-2.5 py-1.5 rounded-[5px] border transition-all cursor-pointer shrink-0"
                    [ngClass]="copied ? 'bg-emerald-50 text-emerald-600 border-emerald-300 dark:bg-emerald-950/50 dark:text-emerald-400 dark:border-emerald-800' : 'bg-[var(--surface-card)] text-[var(--text-color-secondary)] border-[#dddddd] hover:bg-surface-100 dark:border-surface-600 dark:hover:bg-surface-700'">
                    <i class="pi !text-[12px]" [ngClass]="copied ? 'pi-check' : 'pi-copy'"></i>
                    <span>{{ copied ? 'Copié !' : 'Copier' }}</span>
                </button>
            </div>

            <!-- Champ de saisie -->
            <div class="w-full text-left mb-1">
                <label class="block text-[12px] font-semibold text-[var(--heading-color)] mb-1.5">
                    Saisissez {{ targetLabel }} pour confirmer <span class="text-rose-500">*</span>
                </label>
                <input 
                    pInputText 
                    type="text" 
                    [(ngModel)]="enteredValue" 
                    [placeholder]="'Tapez ' + expectedValue"
                    class="w-full text-[13px] py-2 px-3 border border-[#dddddd] dark:border-surface-700 rounded-[5px] focus:ring-2"
                    [ngClass]="inputFocusClass"
                    (keydown.enter)="isMatch && onConfirm()"
                    autofocus />
            </div>

            <!-- Séparateur -->
            <div class="w-full border-t border-[#dddddd]/70 dark:border-surface-700 my-4"></div>

            <!-- Boutons d'actions -->
            <div class="flex items-center justify-center gap-3 w-full">
                <button 
                    type="button" 
                    pButton 
                    label="Annuler" 
                    class="p-button-outlined p-button-secondary p-button-sm flex-1 justify-center rounded-[6px]"
                    (click)="onCancel()"
                    [disabled]="loading">
                </button>
                <button 
                    type="button" 
                    pButton 
                    [label]="confirmLabel" 
                    [icon]="confirmIcon"
                    [ngClass]="confirmButtonClass"
                    (click)="onConfirm()"
                    [disabled]="!isMatch || loading"
                    [loading]="loading">
                </button>
            </div>
        </div>
    </ng-template>
</p-dialog>
