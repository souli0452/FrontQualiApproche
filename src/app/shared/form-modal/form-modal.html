<p-dialog 
    [(visible)]="visible" 
    (onHide)="onHideDialog()" 
    [modal]="true" 
    maskStyleClass="backdrop-blur-sm"
    [style]="{width: width}" 
    [draggable]="false" 
    [resizable]="false" 
    styleClass="p-fluid">
    
    <!-- Header personnalisé -->
    <ng-template pTemplate="header">
        <div class="flex items-center gap-4">
            <!-- Icône avec background -->
            <div [class]="'flex items-center justify-center w-12 h-12 rounded-xl shrink-0 ' + iconBgClass">
                <i [class]="icon + ' ' + iconColorClass + ' text-xl'"></i>
            </div>
            <!-- Titre et description courte -->
            <div>
                <h4 class="text-lg font-semibold text-surface-900 dark:text-surface-0 m-0">{{ title }}</h4>
                <p class="text-sm text-surface-500 m-0 mt-1 leading-snug" *ngIf="description">{{ description }}</p>
            </div>
        </div>
    </ng-template>

    <div class="flex flex-col gap-6 mt-2">
        <!-- Grande description (optionnelle) -->
        <div *ngIf="longDescription" class="bg-sky-50 dark:bg-sky-800/50 p-4 rounded-lg border-l-4 border-l-sky-500">
            <p class="text-sm text-slate-600 dark:text-surface-300 m-0 leading-relaxed whitespace-normal break-words">{{ longDescription }}</p>
        </div>

        <!-- Contenu dynamique (champs de formulaire) -->
        <div class="flex flex-col gap-5">
            <ng-content></ng-content>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-6 border-t border-surface-100 dark:border-surface-800">
            <!-- <button 
                type="button" 
                pButton 
                [label]="cancelLabel" 
                (click)="handleCancel()" 
                class="p-button-text p-button-secondary !text-surface-600 dark:!text-surface-400 !font-semibold">
            </button> -->
            <p-button 
            [label]="cancelLabel"
            (click)="handleCancel()" 
            severity="secondary" />
            <p-button 
                [label]="submitLabel"
                (click)="handleSubmit()" 
                [disabled]="isSubmitting || isSubmitDisabled"
                [loading]="isSubmitting"
                severity="info" />
            <!-- <button 
                type="button" 
                pButton

                [label]="submitLabel"
                (click)="handleSubmit()" 
                [disabled]="isSubmitting || isSubmitDisabled"
                [loading]="isSubmitting"
                class="!px-6 !py-2.5 !font-semibold !rounded-lg transition-colors border-none"
                [ngClass]="submitColorClass">
            </button> -->
        </div>
    </div>
</p-dialog>
