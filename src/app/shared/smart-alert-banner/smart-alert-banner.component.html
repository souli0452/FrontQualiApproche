<div *ngIf="activeAlerts.length > 0"
     class="grid grid-cols-1 gap-3 mb-4">
    <div *ngFor="let item of activeAlerts; let i = index; trackBy: trackByKey"
         class="relative flex items-center justify-between gap-3 px-4 py-2.5 rounded-[5px] bg-[var(--surface-card)] border border-[#dddddd] dark:border-surface-700 shadow-card transition-all duration-200">

        <div class="flex items-center gap-3 min-w-0">
            <!-- Pastille icône ronde colorée selon le type d'alerte -->
            <div [ngClass]="[
                    'w-9 h-9 rounded-full flex items-center justify-center shrink-0',
                    getColorConfig(item.color).iconBg,
                    getColorConfig(item.color).iconText
                 ]">
                <i [ngClass]="[item.icon || 'pi pi-bell', '!text-[15px]']"></i>
            </div>

            <!-- Détails de l'alerte -->
            <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                    <span *ngIf="item.badgeText"
                          [ngClass]="['text-[12px] font-semibold uppercase', getColorConfig(item.color).badgeText]">
                        {{ item.badgeText }}
                    </span>
                    <span [ngClass]="['text-[12px] font-bold leading-none', getColorConfig(item.color).badgeText]">
                        ({{ item.count }})
                    </span>
                </div>
                <p class="text-[13px] text-[var(--text-color-secondary)] truncate m-0 mt-0.5">
                    {{ item.message }}
                </p>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 shrink-0">
            <a *ngIf="item.routerLink"
               [routerLink]="item.routerLink"
               class="inline-flex items-center gap-1.5 px-[10px] py-[6px] rounded-[5px] text-[13px] font-medium bg-[var(--surface-card)] border border-[#dddddd] dark:border-surface-700 text-[var(--heading-color)] hover:bg-surface-50 dark:hover:bg-surface-800 transition-colors no-underline">
                <span>{{ item.actionLabel || 'Consulter' }}</span>
                <i class="pi pi-arrow-up-right !text-[10px] opacity-70"></i>
            </a>

            <button (click)="dismiss(item, i)"
                    type="button"
                    class="w-7 h-7 rounded-[5px] flex items-center justify-center text-[var(--text-color-secondary)] hover:text-[var(--heading-color)] hover:bg-black/5 dark:hover:bg-white/10 transition-colors cursor-pointer border-none bg-transparent"
                    title="Fermer">
                <i class="pi pi-times !text-[10px]"></i>
            </button>
        </div>
    </div>
</div>
