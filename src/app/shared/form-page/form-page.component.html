<div class="flex flex-col md:flex-row w-full mx-auto pb-8">
    
    <!-- Colonne Principale (Gauche) -->
    <div class="w-full md:w-2/3 md:pr-4">
        <div class="p-4 md:p-6 bg-white dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-800 shadow-sm">
            
            <!-- En-tête -->
            <div class="flex items-center gap-3 mb-4">
                <div class="flex-shrink-0 flex items-center justify-center bg-blue-50 dark:bg-blue-900/30 text-blue-500 rounded-full" style="width: 3.5rem; height: 3.5rem">
                    <i class="pi text-2xl" [ngClass]="icon"></i>
                </div>
                <div class="flex flex-col min-w-0">
                    <span class="font-semibold text-xl text-surface-900 dark:text-surface-0 mb-1 truncate">{{ title }}</span>
                    <span class="text-surface-500 text-sm whitespace-normal">{{ subtitle }}</span>
                </div>
            </div>
            
            <hr class="border-t border-surface-200 dark:border-surface-800 my-4">
            
            <!-- Contenu additionnel éventuel via ng-content (ex: étapes) avant le formulaire -->
            <ng-content select="[before-form]"></ng-content>

            <!-- Formulaire Généré Dynamiquement -->
            <div class="w-full mt-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <ng-container *ngFor="let col of formCols">
                        <ng-container *ngIf="col.visible !== false">
                            <div [ngClass]="(col.type === 'section' || (col.class && !col.class.includes('md:col-6'))) ? 'col-span-1 md:col-span-2' : 'col-span-1'">
                                <app-form-input-template
                                    [col]="col"
                                    [form]="formGroup"
                                    [dropDownObject]="dropDownObject"
                                    [multiSelectObject]="multiselectObject"
                                ></app-form-input-template>
                            </div>
                        </ng-container>
                    </ng-container>
                </div>
            </div>

            <!-- Contenu additionnel éventuel via ng-content après le formulaire -->
            <ng-content></ng-content>

            <!-- Actions (Boutons) -->
            <div class="flex justify-between gap-2 mt-6">
                <button pButton pRipple 
                        class="p-button-secondary font-bold" 
                        [label]="cancelLabel"
                        (click)="handleCancel()">
                </button>

                <div class="flex items-center gap-2">
                    <button pButton pRipple 
                            class="p-button-info font-bold"
                            [label]="submitLabel"
                            [icon]="isSubmitting ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
                            [disabled]="isSubmitDisabled || isSubmitting"
                            (click)="handleSubmit()">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Colonne Secondaire (Droite) : Quick Tips -->
    <div class="w-full md:w-1/3 md:pl-4 md:mt-0">
        <div class="p-5 bg-white dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-800 shadow-sm sticky">
            <h3 class="text-xl font-semibold text-surface-900 dark:text-surface-0 mt-0 mb-4">{{ quickTipsTitle }}</h3>
            
            <div class="flex flex-col gap-4">
                <div *ngFor="let tip of quickTips" class="flex items-start gap-3">
                    <i class="pi text-xl mt-1 flex-shrink-0" 
                       [ngClass]="[tip.icon || 'pi-check-circle', tip.colorClass || 'text-green-500']"></i>
                    <span class="text-surface-700 dark:text-surface-300 leading-relaxed break-words min-w-0" style="white-space: normal;">{{ tip.text }}</span>
                </div>
                
                <!-- Si aucun tip n'est fourni, on peut afficher un contenu custom -->
                <ng-content select="[right-column]"></ng-content>
            </div>
        </div>
    </div>
</div>
