@if (actions.length) {
    <div class="bg-[var(--surface-card)] border border-[#dddddd] dark:border-surface-700 rounded-[5px] shadow-card p-4">
        <div class="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-[#dddddd]/70 dark:border-surface-700">
            <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-[5px] bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0">
                    <i class="pi pi-bolt !text-xs"></i>
                </span>
                <h3 class="text-sm font-bold text-[var(--heading-color)] m-0">Actions rapides</h3>
            </div>
            <span class="text-xs text-[var(--text-color-secondary)]">Accès direct</span>
        </div>

        <div class="flex flex-col gap-2">
            @for (action of actions; track action.route) {
                <button type="button"
                        class="w-full p-2.5 rounded-[5px] bg-surface-50/70 dark:bg-surface-800/40 hover:bg-surface-100/90 dark:hover:bg-surface-800 border border-[#dddddd]/80 dark:border-surface-700 hover:border-[#0ea5e9]/45 flex items-center gap-3 text-left cursor-pointer transition-colors group"
                        (click)="ouvrir(action)">
                    <span class="w-9 h-9 rounded-[5px] border flex items-center justify-center shrink-0"
                          [ngClass]="tonClasse(action.ton)">
                        <i [class]="action.icone + ' !text-sm'"></i>
                    </span>
                    <span class="min-w-0 flex-1">
                        <span class="block text-xs font-bold text-[var(--heading-color)] truncate">{{ action.libelle }}</span>
                        <span class="block text-[11px] text-[var(--text-color-secondary)] mt-0.5 truncate">{{ action.aide }}</span>
                    </span>
                    <i class="pi pi-arrow-right !text-[11px] text-[#0084ca] dark:text-sky-400 opacity-50 group-hover:opacity-100 group-hover:translate-x-0.5 transition-all shrink-0"></i>
                </button>
            }
        </div>
    </div>
}
