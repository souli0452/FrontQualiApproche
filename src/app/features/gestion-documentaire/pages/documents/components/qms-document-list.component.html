<app-tableau-affichage
    [tableCols]="tableCols"
    [listeObject]="documents"
    [loading]="loading"
    [lazy]="true"
    [totalElements]="totalDocuments"
    [pageSize]="taillePage"
    [currentPage]="premiereLigne / taillePage"
    [rowsPerPageOptions]="[5, 10, 20, 50]"
    [clickableRows]="true"
    [hasFilters]="true"
    [showSearch]="true"
    [placeholderRecherche]="'Numéro, titre ou rédacteur...'"
    [searchValue]="searchQuery"
    title="Patrimoine documentaire"
    subtitle="Cycle de vie, versions et conformité de vos documents qualité"
    [badgeCount]="totalDocuments"
    recordName="documents"
    [cellTemplates]="cellTemplates"
    [getActionMenuItems]="getActionMenuItems"
    (rowClick)="open.emit($event)"
    (pageChangeEvent)="onPageChange($event)">

    <!-- Header Actions (Actualiser & Réinitialiser) -->
    <div header-actions class="flex items-center gap-1.5">
        <button pButton pRipple 
                *ngIf="hasActiveFilters()"
                label="Effacer filtres" 
                icon="pi pi-filter-slash" 
                class="p-button-text p-button-sm p-button-secondary text-xs"
                (click)="reinitialiserFiltres()">
        </button>
        <button pButton pRipple 
                icon="pi pi-refresh" 
                class="p-button-text p-button-rounded p-button-secondary p-button-sm" 
                pTooltip="Actualiser" 
                tooltipPosition="bottom"
                (click)="refresh.emit()">
        </button>
    </div>

    <!-- Filters Slot -->
    <div filters class="grid grid-cols-12 gap-3 items-center pt-2 pb-1">
        <!-- Type -->
        <div class="col-span-12 sm:col-span-6 lg:col-span-3">
            <app-select-input [ngModel]="selectedType" (ngModelChange)="selectedTypeChange.emit($event)"
                optionLabel="libelle" optionValue="code" placeholder="Tous les types"
                [lazy]="true" [loadOptions]="chargerTypes" (selectionChange)="refresh.emit()"></app-select-input>
        </div>

        <!-- Processus émetteur (Quality & Admin) -->
        <div class="col-span-12 sm:col-span-6 lg:col-span-3" *ngIf="peutFiltrerParProcessusEmetteur">
            <app-select-input [ngModel]="selectedService" (ngModelChange)="selectedServiceChange.emit($event)"
                optionLabel="libelleLong" optionValue="id" placeholder="Tous les services"
                [lazy]="true" [loadOptions]="chargerStructures" (selectionChange)="refresh.emit()"></app-select-input>
        </div>

        <!-- Priorité -->
        <div class="col-span-12 sm:col-span-6" [ngClass]="peutFiltrerParProcessusEmetteur ? 'lg:col-span-2' : 'lg:col-span-3'">
            <app-select-input [ngModel]="selectedPriorite" (ngModelChange)="selectedPrioriteChange.emit($event)"
                optionLabel="libelle" optionValue="id" placeholder="Toutes les priorités"
                [lazy]="true" [loadOptions]="chargerPriorites" (selectionChange)="refresh.emit()"></app-select-input>
        </div>

        <!-- Confidentialité -->
        <div class="col-span-12 sm:col-span-6" [ngClass]="peutFiltrerParProcessusEmetteur ? 'lg:col-span-2' : 'lg:col-span-3'">
            <app-select-input [ngModel]="selectedNiveauConfidentialite" (ngModelChange)="selectedNiveauConfidentialiteChange.emit($event)"
                optionLabel="libelle" optionValue="id" placeholder="Tous les niveaux"
                [lazy]="true" [loadOptions]="chargerNiveauxConfidentialite" (selectionChange)="refresh.emit()"></app-select-input>
        </div>

        <!-- Domaine -->
        <div class="col-span-12 sm:col-span-6" [ngClass]="peutFiltrerParProcessusEmetteur ? 'lg:col-span-2' : 'lg:col-span-3'">
            <app-select-input [ngModel]="selectedDomaine" (ngModelChange)="selectedDomaineChange.emit($event)"
                optionLabel="libelle" optionValue="id" placeholder="Tous les domaines"
                [lazy]="true" [loadOptions]="chargerDomaines" (selectionChange)="refresh.emit()"></app-select-input>
        </div>
    </div>
</app-tableau-affichage>

<!-- Template Version -->
<ng-template #versionTpl let-doc>
    <span class="font-mono text-xs bg-slate-100 dark:bg-surface-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-surface-700 px-2.5 py-1 rounded-md font-semibold">
        v{{ doc.numeroVersion ?? 0 }}
    </span>
</ng-template>

<!-- Template Statut & Workflow -->
<ng-template #statusTpl let-doc>
    <div class="flex flex-col gap-1 text-left">
        <p-tag [value]="statusLabel(doc)" [severity]="statusSeverity(doc)" styleClass="text-xs w-fit"></p-tag>
        <span class="text-xs text-slate-400" *ngIf="etapeDeCircuit(doc) && !circuitTermine(doc)">
            <i class="pi pi-arrow-right text-xs mr-1"></i>{{ etapeDeCircuit(doc) }}
        </span>
        <span class="text-xs text-emerald-600 font-semibold" *ngIf="circuitTermine(doc)">
            <i class="pi pi-check-circle text-xs mr-1"></i>Circuit terminé
        </span>
        <p-tag *ngIf="aUneDecisionAttendue(doc)" severity="warn" icon="pi pi-bell"
               value="Action attendue" styleClass="text-xs w-fit"></p-tag>
    </div>
</ng-template>
