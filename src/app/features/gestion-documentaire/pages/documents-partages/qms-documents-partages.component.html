<div>
    <app-tableau-affichage
        [tableCols]="tableCols"
        [listeObject]="sharedDocuments"
        [loading]="loading"
        [totalElements]="sharedDocuments.length"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [clickableRows]="true"
        [showSearch]="true"
        [placeholderRecherche]="'Numéro, titre, structure ou rédacteur...'"
        [filterFields]="filterFields"
        title="Documents partagés avec moi"
        titleIcon="pi pi-share-alt"
        titleIconClass="text-[#0084ca] dark:text-sky-400"
        subtitle="Documents d'autres structures, ouverts à la consultation et au téléchargement. Leur historique et leur suivi interne restent à la structure qui les a émis."
        [badgeCount]="sharedDocuments.length"
        recordName="documents partagés"
        [cellTemplates]="cellTemplates"
        [getActionMenuItems]="getActionMenuItems"
        (rowClick)="onRowClick($event)"
        (pageChangeEvent)="onPageChange($event)">

        <!-- Header Actions (Actualiser) -->
        <div header-actions class="flex items-center gap-1.5">
            <p-button icon="pi pi-refresh"
                      severity="secondary"
                      [text]="true"
                      [rounded]="true"
                      size="small"
                      pTooltip="Actualiser"
                      tooltipPosition="bottom"
                      (onClick)="loadSharedDocuments()">
            </p-button>
        </div>
    </app-tableau-affichage>
</div>

<!-- Cell Templates -->
<ng-template #versionTemplate let-row>
    <span *ngIf="row.versionLabel"
          class="inline-flex items-center px-2 py-0.5 rounded-[4px] font-mono text-xs font-semibold bg-surface-100 dark:bg-surface-800 text-[var(--heading-color)] border border-[#dddddd] dark:border-surface-700">
        {{ row.versionLabel }}
    </span>
    <span *ngIf="!row.versionLabel" class="text-[var(--text-color-secondary)] text-xs">—</span>
</ng-template>

<ng-template #structureTemplate let-row>
    <span class="font-medium text-[var(--heading-color)]">
        {{ row.serviceSigle || row.serviceLibelle || '—' }}
    </span>
</ng-template>

<ng-template #partageTemplate let-row>
    <div class="flex flex-col items-start gap-1">
        <span class="px-2 py-0.5 rounded-[4px] text-xs font-semibold inline-flex items-center gap-1.5 border"
              [ngClass]="row.partageStructure
                ? 'bg-emerald-500/10 text-emerald-700 border-emerald-500/30 dark:text-emerald-300'
                : 'bg-[#0ea5e9]/10 text-[#0084ca] border-[#0ea5e9]/35 dark:text-sky-300'">
            <i class="pi !text-[11px]" [ngClass]="row.partageStructure ? 'pi-building' : 'pi-user'"></i>
            {{ row.partageStructure ? 'À ma structure' : 'À moi' }}
        </span>
        <span class="text-[11px] text-[var(--text-color-secondary)]" *ngIf="row.partagePar">
            par {{ row.partagePar }}
        </span>
    </div>
</ng-template>

<!-- Lightbox pour prévisualisation immédiate sans téléchargement obligatoire -->
<app-lightbox #lightbox></app-lightbox>
