<p-card>
<!-- 1. BADGE DE PORTÉE DYNAMIQUE (RQ vs PILOTE) -->
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-surface-200 dark:border-surface-700">
        <div class="flex items-center gap-2.5">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold"
                  [ngClass]="porteeGlobale 
                    ? 'bg-blue-50 text-blue-700 dark:bg-blue-950/40 dark:text-blue-300 border border-blue-200 dark:border-blue-800/40' 
                    : 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40'">
                <i [class]="porteeGlobale ? 'pi pi-globe text-xs' : 'pi pi-building text-xs'"></i>
                <span>{{ porteeGlobale ? 'Périmètre Global' : 'Périmètre Local' }}</span>
            </span>
            <span class="text-xs text-surface-500 dark:text-surface-400">
                Chiffres consolidés sur <strong class="text-surface-700 dark:text-surface-200">{{ porteeGlobale ? 'toutes les structures' : 'votre structure' }}</strong>.
            </span>
        </div>
    </div>
    <!-- 2. LES 4 CARTES KPI DYNAMIQUES ET CONTEXTUELLES -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        
        <!-- 1. Documents à traiter -->
        <app-kpi-card
            label="Documents à traiter"
            icon="pi pi-inbox"
            color="orange"
            [value]="documentsATraiter.length"
            [loading]="chargementATraiter"
            [description]="porteeGlobale ? 'Validations et approbations transversales' : 'Actions requises pour votre entité'"
            [meterData]="documentsATraiterMeterData"
            [meterMax]="documentsATraiterMeterMax"
            [subText]="documentsATraiterSubText"
            routerLink="/gestion-documentaire/documents"
            [clickable]="true">
        </app-kpi-card>
        <!-- 2. Demandes à instruire -->
        <app-kpi-card
            label="Demandes à instruire"
            icon="pi pi-file-edit"
            color="purple"
            [value]="demandesATraiter.length"
            [loading]="chargementATraiter"
            [description]="porteeGlobale ? 'Demandes en attente d\'arbitrage qualité' : 'Demandes concernant vos documents'"
            [meterData]="demandesATraiterMeterData"
            [meterMax]="demandesATraiterMeterMax"
            [subText]="demandesATraiterSubText"
            routerLink="/gestion-documentaire/demandes"
            [clickable]="true">
        </app-kpi-card>
        <!-- 3. Total Documents -->
        <app-kpi-card
            label="Total Documents"
            icon="pi pi-folder"
            color="solid-blue"
            [value]="stats?.totalDocuments || 0"
            [loading]="loading"
            [description]="porteeGlobale ? 'Patrimoine documentaire de l\'organisme' : 'Documents rattachés à votre entité'"
            [meterData]="totalDocumentsMeterData"
            [meterMax]="totalDocumentsMeterMax"
            [subText]="totalDocumentsSubText"
            routerLink="/gestion-documentaire/documents"
            [clickable]="true">
        </app-kpi-card>
        <!-- 4. En retard de révision -->
        <app-kpi-card
            label="En retard de révision"
            icon="pi pi-clock"
            [color]="(stats?.documentsEnRetardRevision || 0) > 0 ? 'red' : 'green'"
            [value]="stats?.documentsEnRetardRevision || 0"
            [loading]="loading"
            [description]="(stats?.documentsEnRetardRevision || 0) > 0 
                ? (porteeGlobale ? 'Documents échus sur toutes les structures' : 'Documents échus dans votre structure')
                : 'Tous les documents sont à jour'"
            [meterData]="retardRevisionMeterData"
            [meterMax]="retardRevisionMeterMax"
            [subText]="retardRevisionSubText"
            routerLink="/gestion-documentaire/documents"
            [clickable]="true">
        </app-kpi-card>
    </div>

    <!-- 3. GRAPHIQUES DE PILOTAGE : ÉVOLUTION ET RÉPARTITION -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 mb-6">
        <!-- Bloc 1 : Graphique d'Évolution (Gauche ~60% sur Desktop) -->
        <div class="lg:col-span-7 xl:col-span-7 min-w-0 w-full">
            <app-chart-evolution
                [title]="'Évolution de l\'activité documentaire'"
                [total]="evolutionTotal"
                [chartData]="evolutionChartData"
                [showStructureFilter]="false"
                [selectedYear]="selectedYear"
                [selectedMonth]="selectedMonth"
                [breakdownItems]="evolutionBreakdownItems"
                (filterChange)="onChartFilterChange($event)">
            </app-chart-evolution>
        </div>

        <!-- Bloc 2 : Donut Répartition du Patrimoine (Droite ~40% sur Desktop) -->
        <div class="lg:col-span-5 xl:col-span-5 min-w-0 w-full">
            <app-chart-donut
                [title]="donutMode === 'STATUT' ? 'Statut du Patrimoine' : 'Typologie documentaire'"
                [subTitle]="'Répartition dynamique du fonds documentaire'"
                [total]="stats?.totalDocuments || 0"
                [totalLabel]="'DOCUMENTS'"
                [series]="donutSeries"
                [labels]="donutLabels"
                [colors]="donutColors"
                [customStats]="donutStats">
                <div header-action class="flex items-center bg-slate-100 dark:bg-surface-800 p-1 rounded-xl border border-slate-200/90 dark:border-surface-700 shadow-2xs gap-1">
                    <button type="button" 
                            class="px-3 py-1.5 rounded-lg font-semibold text-xs border-none cursor-pointer transition-all duration-200 flex items-center gap-1.5 select-none"
                            [ngClass]="donutMode === 'STATUT' ? 'bg-[#0084ca] text-white shadow-sm ring-1 ring-[#0084ca]/20 font-bold' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-surface-700 bg-transparent'"
                            (click)="setDonutMode('STATUT')"
                            pTooltip="Afficher la répartition par statut de validation"
                            tooltipPosition="bottom">
                        <i class="pi pi-check-circle text-[11px]" [ngClass]="donutMode === 'STATUT' ? 'text-white' : 'text-slate-400'"></i>
                        <span>Statuts</span>
                    </button>
                    <button type="button" 
                            class="px-3 py-1.5 rounded-lg font-semibold text-xs border-none cursor-pointer transition-all duration-200 flex items-center gap-1.5 select-none"
                            [ngClass]="donutMode === 'TYPE' ? 'bg-[#0084ca] text-white shadow-sm ring-1 ring-[#0084ca]/20 font-bold' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-surface-700 bg-transparent'"
                            (click)="setDonutMode('TYPE')"
                            pTooltip="Afficher la typologie des documents (Procédure, Norme...)"
                            tooltipPosition="bottom">
                        <i class="pi pi-tags text-[11px]" [ngClass]="donutMode === 'TYPE' ? 'text-white' : 'text-slate-400'"></i>
                        <span>Types</span>
                    </button>
                </div>
            </app-chart-donut>
        </div>
    </div>

    <!-- ------------------------------------------------------------------ à traiter -->
    <!-- Ce qui attend un geste, avec de quoi le faire sur place : les boutons sont ceux que le
         circuit ouvre à l'appelant sur chaque dossier. Auparavant l'écran montrait des courbes de
         dépôts, et il fallait aller chercher ailleurs les dossiers qui attendaient. -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-6 items-start">
        <app-qms-a-traiter
            titre="Documents attendant votre décision"
            icone="pi pi-inbox"
            [lignes]="documentsATraiter"
            [chargement]="chargementATraiter"
            recordName="documents"
            messageVide="Aucun document n'attend votre décision."
            lienLibelle="Tous les documents"
            (traite)="apresDecision()"
            (apercu)="ouvrirApercu($event)"
            (modifier)="modifierDossier($event)"
            (voirDetail)="ouvrirLeDocument($event)"
            (voirTout)="voirLesDocuments()">
        </app-qms-a-traiter>

        <app-qms-a-traiter
            titre="Demandes à instruire"
            icone="pi pi-file-edit"
            [lignes]="demandesATraiter"
            [chargement]="chargementATraiter"
            recordName="demandes"
            messageVide="Aucune demande n'attend votre instruction."
            lienLibelle="Toutes les demandes"
            (traite)="apresDecision()"
            (apercu)="ouvrirApercu($event)"
            (modifier)="ouvrirLaDemande($event)"
            (voirDetail)="ouvrirLaDemande($event)"
            (voirTout)="voirLesDemandes()">
        </app-qms-a-traiter>
    </div>

    <!-- Lightbox de visualisation des documents (PDF et images) -->
    <app-lightbox #lightbox></app-lightbox>
</p-card>
