<div class="p-6 max-w-5xl mx-auto">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-surface-900 dark:text-surface-50 m-0">Référentiel RQAP-BF</h2>
            <p class="text-sm text-surface-500 dark:text-surface-400 m-0 mt-1">Structure du référentiel qualité des achats publics du Burkina Faso</p>
        </div>
        <p-button icon="pi pi-refresh" [rounded]="true" [text]="true" severity="secondary" pTooltip="Recharger" (onClick)="charger()"></p-button>
    </div>

    <div class="mb-4">
        <span class="p-input-icon-left w-full sm:w-80">
            <i class="pi pi-search"></i>
            <input pInputText [(ngModel)]="recherche" class="w-full" placeholder="Rechercher un critère ou domaine…" />
        </span>
    </div>

    <div *ngIf="loading" class="space-y-3">
        <p-skeleton *ngFor="let i of [1,2,3,4,5]" height="3rem" borderRadius="8px"></p-skeleton>
    </div>

    <div *ngIf="!loading">
        <div *ngIf="referentielFiltre.length === 0" class="flex flex-col items-center justify-center py-20">
            <i class="pi pi-search text-5xl text-surface-300 dark:text-surface-600 mb-4"></i>
            <p class="text-sm text-surface-500 dark:text-surface-400 m-0">Aucun résultat trouvé.</p>
        </div>

        <p-tree
            *ngIf="referentielFiltre.length > 0"
            [value]="referentielFiltre"
            styleClass="border border-surface-200 dark:border-surface-700 rounded-xl overflow-hidden">
            <ng-template pTemplate="default" let-node>
                <div class="flex items-center gap-3">
                    <span *ngIf="node.data?.code" class="font-mono text-xs font-bold text-primary bg-primary/10 px-2 py-0.5 rounded">{{ node.data.code }}</span>
                    <span class="text-sm text-surface-900 dark:text-surface-100">{{ node.label }}</span>
                    <span *ngIf="node.data?.ponderation" class="text-xs text-surface-500 dark:text-surface-400 ml-auto">
                        Pondération : {{ node.data.ponderation }}%
                    </span>
                </div>
            </ng-template>
        </p-tree>
    </div>

</div>
