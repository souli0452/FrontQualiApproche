<div class="p-6">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-surface-900 dark:text-surface-50 m-0">Checklists d'audit</h2>
            <p class="text-sm text-surface-500 dark:text-surface-400 m-0 mt-1">Modèles de points de contrôle réutilisables</p>
        </div>
        <p-button icon="pi pi-plus" label="Nouvelle checklist" (onClick)="ouvrirCreation()"></p-button>
    </div>

    <div *ngIf="loading" class="space-y-3">
        <p-skeleton *ngFor="let i of [1,2,3,4,5]" height="4rem" borderRadius="8px"></p-skeleton>
    </div>

    <div *ngIf="!loading && checklists.length === 0" class="flex flex-col items-center justify-center py-20">
        <i class="pi pi-list-check text-5xl text-surface-300 dark:text-surface-600 mb-4"></i>
        <p class="text-sm text-surface-500 dark:text-surface-400 m-0">Aucune checklist disponible.</p>
    </div>

    <div *ngIf="!loading && checklists.length > 0">
        <div class="bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl overflow-hidden">
            <div *ngFor="let cl of checklists; trackBy: trackById"
                 class="flex items-center gap-4 p-4 border-b border-surface-100 dark:border-surface-800 last:border-0 hover:bg-surface-50 dark:hover:bg-surface-800/40 transition-colors">
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-surface-900 dark:text-surface-100 text-sm m-0 mb-1">{{ cl.libelle }}</p>
                    <p *ngIf="cl.description" class="text-xs text-surface-500 dark:text-surface-400 m-0 line-clamp-1">{{ cl.description }}</p>
                </div>
                <p-tag *ngIf="cl.statut" [value]="cl.statut" severity="secondary" [rounded]="true"></p-tag>
                <div class="flex gap-1 shrink-0">
                    <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary" size="small" pTooltip="Modifier" (onClick)="ouvrirEdition(cl)"></p-button>
                    <p-button icon="pi pi-copy" [rounded]="true" [text]="true" severity="secondary" size="small" pTooltip="Dupliquer" (onClick)="dupliquer(cl)"></p-button>
                    <p-button icon="pi pi-send" [rounded]="true" [text]="true" severity="success" size="small" pTooltip="Publier" (onClick)="publier(cl)"></p-button>
                    <p-button icon="pi pi-archive" [rounded]="true" [text]="true" severity="warn" size="small" pTooltip="Archiver" (onClick)="archiver(cl)"></p-button>
                    <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" size="small" pTooltip="Supprimer" (onClick)="supprimer(cl)"></p-button>
                </div>
            </div>
        </div>

        <p-paginator
            *ngIf="totalElements > pageSize"
            [rows]="pageSize"
            [totalRecords]="totalElements"
            [first]="currentPage * pageSize"
            (onPageChange)="onPageChange($event)"
            styleClass="mt-4">
        </p-paginator>
    </div>

    <p-dialog header="{{ checklistEnEdition ? 'Modifier la checklist' : 'Nouvelle checklist' }}"
              [(visible)]="afficherDialogue" [modal]="true" [style]="{ width: '480px' }" [closable]="true">
        <form [formGroup]="formulaire" class="space-y-4">
            <div>
                <label class="text-xs font-medium text-surface-700 dark:text-surface-300 block mb-1">Libellé <span class="text-red-500">*</span></label>
                <input pInputText formControlName="libelle" class="w-full" placeholder="Nom de la checklist" />
                <small *ngIf="formulaire.get('libelle')?.invalid && formulaire.get('libelle')?.touched" class="text-red-500">Champ obligatoire.</small>
            </div>
            <div>
                <label class="text-xs font-medium text-surface-700 dark:text-surface-300 block mb-1">Description</label>
                <textarea pInputTextarea formControlName="description" rows="3" class="w-full" placeholder="Description (facultatif)" [autoResize]="true"></textarea>
            </div>
        </form>
        <ng-template pTemplate="footer">
            <p-button label="Annuler" severity="secondary" [outlined]="true" size="small" (onClick)="afficherDialogue = false"></p-button>
            <p-button label="Sauvegarder" size="small" [loading]="saving" (onClick)="sauvegarder()"></p-button>
        </ng-template>
    </p-dialog>
</div>
