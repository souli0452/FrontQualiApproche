<div class="p-6 max-w-5xl mx-auto">
    <p-toast></p-toast>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-surface-900 dark:text-surface-50 m-0">Plan d'audit</h2>
            <p class="text-sm text-surface-500 dark:text-surface-400 m-0 mt-1">Calendrier détaillé des activités d'audit</p>
        </div>
        <div class="flex gap-2">
            <p-button icon="pi pi-download" label="Télécharger" [outlined]="true" severity="secondary" size="small" (onClick)="telecharger()"></p-button>
            <p-button icon="pi pi-share-alt" label="Partager" [outlined]="true" severity="secondary" size="small" (onClick)="partager()"></p-button>
            <p-button icon="pi pi-save" label="Sauvegarder" size="small" [loading]="saving" (onClick)="sauvegarder()"></p-button>
        </div>
    </div>

    <div *ngIf="loading" class="space-y-3">
        <p-skeleton height="100px" borderRadius="12px"></p-skeleton>
        <p-skeleton height="200px" borderRadius="12px"></p-skeleton>
    </div>

    <div *ngIf="!loading && !plan" class="flex flex-col items-center justify-center py-20">
        <i class="pi pi-calendar text-5xl text-surface-300 dark:text-surface-600 mb-4"></i>
        <p class="text-sm text-surface-500 dark:text-surface-400 m-0">Aucun plan défini pour cet audit.</p>
    </div>

    <ng-container *ngIf="!loading && plan">
        <div class="bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl p-5 mb-5">
            <h3 class="text-sm font-bold text-surface-700 dark:text-surface-300 uppercase tracking-wide m-0 mb-4">Informations générales du plan</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="text-xs text-surface-500 dark:text-surface-400 block mb-1">Date de début</label>
                    <input pInputText [(ngModel)]="plan.dateDebut" class="w-full" placeholder="JJ/MM/AAAA" />
                </div>
                <div>
                    <label class="text-xs text-surface-500 dark:text-surface-400 block mb-1">Date de fin</label>
                    <input pInputText [(ngModel)]="plan.dateFin" class="w-full" placeholder="JJ/MM/AAAA" />
                </div>
                <div class="sm:col-span-2">
                    <label class="text-xs text-surface-500 dark:text-surface-400 block mb-1">Lieu</label>
                    <input pInputText [(ngModel)]="plan.lieu" class="w-full" placeholder="Lieu de l'audit" />
                </div>
            </div>
        </div>

        <div class="bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl p-5">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-surface-700 dark:text-surface-300 uppercase tracking-wide m-0">Activités planifiées</h3>
                <p-button icon="pi pi-plus" label="Ajouter" size="small" (onClick)="ajouterActivite()"></p-button>
            </div>

            <div *ngIf="!plan.activites?.length" class="py-8 text-center">
                <p class="text-sm text-surface-500 dark:text-surface-400 m-0">Aucune activité planifiée. Cliquez sur « Ajouter » pour en créer une.</p>
            </div>

            <div class="space-y-3">
                <div *ngFor="let activite of plan.activites; let i = index; trackBy: trackByIndex"
                     class="border border-surface-200 dark:border-surface-700 rounded-lg p-4">
                    <div class="flex items-start gap-3">
                        <div class="flex-1 grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div class="sm:col-span-2">
                                <label class="text-xs text-surface-500 dark:text-surface-400 block mb-1">Libellé de l'activité</label>
                                <input pInputText [(ngModel)]="activite.libelleActivite" class="w-full" placeholder="Description de l'activité" />
                            </div>
                            <div>
                                <label class="text-xs text-surface-500 dark:text-surface-400 block mb-1">Auditeur</label>
                                <input pInputText [(ngModel)]="activite.auditeur" class="w-full" placeholder="Auditeur responsable" />
                            </div>
                        </div>
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" size="small"
                                  (onClick)="retirerActivite(i)"></p-button>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</div>
