<div class="flex flex-col">
    <!-- En-tête compact ligne unique + onglets, fond opaque pour éviter le recouvrement au scroll -->
    <div class="sticky top-0 z-20 bg-white dark:bg-surface-900 border-b border-surface-200 dark:border-surface-700 shadow-sm">
        <div class="flex items-center justify-between px-4 py-2 gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <a routerLink="/" class="text-sm text-surface-500 dark:text-surface-400 hover:text-primary transition-colors shrink-0">
                    Tableau de bord
                </a>
                <i class="pi pi-angle-right text-xs text-surface-400 shrink-0"></i>
                <span class="text-sm font-semibold text-surface-900 dark:text-surface-50 truncate">
                    Gestion des Audits<ng-container *ngIf="libelleOngletActif"> — {{ libelleOngletActif }}</ng-container>
                </span>
            </div>
            <!-- Bouton « Planifier » affiché uniquement sur la liste du programme -->
            <p-button *ngIf="activeTab === '/gestion-audit/programme'"
                      icon="pi pi-plus" label="Planifier un audit" size="small"
                      routerLink="/gestion-audit/programme/create" class="shrink-0" />
        </div>

        <div class="bg-surface-0 dark:bg-surface-900">
            <p-tabs [value]="activeTab" [scrollable]="true" (valueChange)="onTabChange($event)">
                <p-tablist>
                    <p-tab
                        *ngFor="let tab of items; trackBy: trackByRouterLink"
                        [value]="tab.routerLink">
                        <div class="flex items-center gap-2 text-inherit no-underline outline-none px-2 py-1 select-none">
                            <i [class]="tab.icon"></i>
                            <span class="whitespace-nowrap">{{ tab.label }}</span>
                            <p-badge *ngIf="tab.badge" [value]="tab.badge" severity="danger"></p-badge>
                        </div>
                    </p-tab>
                </p-tablist>
            </p-tabs>
        </div>
    </div>

    <div class="dark:bg-surface-950/40">
        <div class="dark:bg-surface-900 rounded-xl !overflow-visible">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
