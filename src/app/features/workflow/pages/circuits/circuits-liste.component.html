<div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 my-4 p-2">
    <!-- Bouton guide (À droite, aligné) -->
    <div>
        <p-button 
            label="Comprendre la configuration d'un circuit" 
            icon="pi pi-question-circle"
            size="small" 
            [text]="true" 
            severity="info"
            (onClick)="guideOuvert = true">
        </p-button>
    </div>
    <!-- Filtre par type de ressource (À gauche) -->
    <div class="flex flex-col gap-1.5 w-full sm:w-80">
        <p-select 
            [options]="filtres[0].list" 
            [(ngModel)]="typeFiltre"
            (ngModelChange)="filtrerParType($event)"
            [placeholder]="'Type de ressource'"
            [showClear]="true"
            appendTo="body"
            styleClass="w-full text-sm">
        </p-select>
    </div>
</div>

<app-workflow-configuration-guide 
    [(visible)]="guideOuvert">
</app-workflow-configuration-guide>

@if (typesEnConflit.length) {
    <!-- Informatif, et non plus une alerte : plusieurs circuits actifs sont normaux dès qu'un type
         de document désigne le sien. Ce qui mérite d'être dit est lequel sert de repli. -->
    <div class="flex items-start gap-2 mb-4 p-3 border-round bg-blue-50 text-blue-900 text-sm">
        <i class="pi pi-info-circle mt-0.5"></i>
        <span>
            Plusieurs circuits sont actifs pour {{ typesEnConflit.join(', ') }} : les dossiers qui ne
            désignent pas de circuit — un type de document sans circuit attribué, par exemple —
            prennent le <strong>plus ancien</strong> d'entre eux.
        </span>
    </div>
}

<!-- Tableau générique : même composant que le catalogue d'étapes et que les autres écrans de
     configuration. Les actions passent par son menu de ligne ; la consultation et la saisie sont
     des pages (`circuits/detail/:id`, `circuits/edition/:id`), qu'aucun formulaire générique ne
     saurait décrire (étapes, transitions, champs de saisie).

     La suppression n'y figure pas (`notDelete`) : un circuit est la seule description des étapes
     que les dossiers ont traversées, et les dossiers clos y renvoient encore. Ce qu'on veut en
     retirant un circuit — qu'il ne serve plus — s'obtient en le désactivant, sans rien perdre. -->

<app-crud-generic 
    #crudGeneric
    [loading]="loading"
    [tableCols]="colonnes" 
    [listeObject]="circuits"
    [pageLabel]="titrePage" 
    [addButtonLabel]="'Nouveau circuit'"
    [addFilter]="false" 
    [ajoutExterne]="true" 
    (ajoutDemande)="creerCircuit()"
    [formGroup]="formulaireTableau" 
    [formCols]="[]" 
    [notModif]="true" 
    [notDelete]="true"
    [isAffich]="false" 
    [asRoleEdit]="true" 
    [customButtons]="actionsLigne"
    (customActionEvent)="executerAction($event)"
    [consultation]="!peutEcrire"
    [isPagination]="true"
    [totalElements]="totalElements"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    (pageChangeEvent)="onPageChange($event)">
</app-crud-generic>
