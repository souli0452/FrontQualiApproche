<app-audit-page-formulaire [titre]="'Nouveau client'"
                           [sousTitre]="'Une organisation hébergée par la plateforme, avec ses propres données'"
                           [icone]="'pi-building'" [conseils]="conseils">
    <p-stepper [value]="etape" (valueChange)="allerA($event)" styleClass="mb-2 hidden md:block">
        <p-step-list>
            <p-step *ngFor="let e of etapes; let n = index" [value]="n + 1">{{ e }}</p-step>
        </p-step-list>
    </p-stepper>

    <form [formGroup]="formulaire" (ngSubmit)="creer()">
        <!-- Étape 1 : le client -->
        <div *ngIf="etape === 1" class="flex flex-col gap-3">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-3">
                <div class="md:col-span-2">
                    <app-audit-libelle texte="Nom du client" [requis]="true"
                                       aide="Le nom de l'organisation, tel qu'il paraîtra dans ses écrans et ses documents." />
                    <input pInputText formControlName="libelleLong" class="w-full" placeholder="Ex. : Direction de la Qualité" />
                    <small *ngIf="invalide('libelleLong')" class="p-error">Ce champ est requis</small>
                </div>
                <div>
                    <app-audit-libelle texte="Sigle" aide="Le nom court ; à défaut, le nom complet sert." />
                    <input pInputText formControlName="libelleCourt" class="w-full" placeholder="Ex. : DQ" />
                </div>
                <div>
                    <app-audit-libelle texte="Courriel du client" [requis]="true"
                                       aide="L'adresse de la direction ; elle reçoit les alertes d'échéance de licence à défaut d'administrateur joignable." />
                    <input pInputText formControlName="email" type="email" class="w-full" (blur)="reprendreLAdresse()" />
                    <small *ngIf="invalide('email')" class="p-error">Adresse requise et valide</small>
                </div>
                <div class="md:col-span-2">
                    <app-audit-libelle texte="Code partenaire"
                                       aide="Le code inscrit dans les licences émises pour ce client. Seules ses licences y seront acceptées." />
                    <input pInputText formControlName="code" class="w-full" placeholder="Ex. : DQ-BF" />
                </div>
            </div>
        </div>

        <!-- Étape 2 : son super administrateur -->
        <div *ngIf="etape === 2" class="flex flex-col gap-3">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-3">
                <div>
                    <app-audit-libelle texte="Identifiant de connexion" [requis]="true"
                                       aide="Ce que l'administrateur saisira pour se connecter ; souvent son adresse." />
                    <input pInputText formControlName="adminUsername" class="w-full" />
                    <small *ngIf="invalide('adminUsername')" class="p-error">Ce champ est requis</small>
                </div>
                <div>
                    <app-audit-libelle texte="Courriel" [requis]="true"
                                       aide="Il y reçoit le lien pour définir son mot de passe." />
                    <input pInputText formControlName="adminEmail" type="email" class="w-full" />
                    <small *ngIf="invalide('adminEmail')" class="p-error">Adresse requise et valide</small>
                </div>
                <div>
                    <app-audit-libelle texte="Prénom" [requis]="true" />
                    <input pInputText formControlName="adminFirstName" class="w-full" />
                    <small *ngIf="invalide('adminFirstName')" class="p-error">Ce champ est requis</small>
                </div>
                <div>
                    <app-audit-libelle texte="Nom" [requis]="true" />
                    <input pInputText formControlName="adminLastName" class="w-full" />
                    <small *ngIf="invalide('adminLastName')" class="p-error">Ce champ est requis</small>
                </div>
            </div>
        </div>
    </form>

    <div actions class="contents">
        <button pButton type="button" class="p-button-secondary font-bold" label="Annuler" (click)="annuler()"></button>
        <div class="flex gap-2">
            <button *ngIf="etape > 1" pButton type="button" class="p-button-secondary p-button-outlined font-bold"
                    icon="pi pi-arrow-left" label="Précédent" (click)="precedent()"></button>
            <button *ngIf="etape < etapes.length" pButton type="button" class="p-button-primary font-bold"
                    icon="pi pi-arrow-right" iconPos="right" label="Suivant" (click)="suivant()"></button>
            <button *ngIf="etape === etapes.length" pButton type="button" class="p-button-primary font-bold"
                    icon="pi pi-check" label="Créer le client" [loading]="saving" (click)="creer()"></button>
        </div>
    </div>
</app-audit-page-formulaire>
