<div *ngIf="hasActiveAlerts && !loading" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
    <!-- Alerte 1 : Non-Conformités à traiter -->
    <div *ngIf="!closedNc && countNcATraiter > 0" 
         class="relative flex items-center justify-between gap-3 px-4 py-2.5 rounded-xl border border-amber-500/20 bg-gradient-to-r from-amber-500/10 via-amber-500/5 to-transparent dark:border-amber-500/30 dark:from-amber-500/15 backdrop-blur-sm shadow-xs transition-all duration-300">
        
        <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-amber-500/20 dark:bg-amber-500/30 flex items-center justify-center shrink-0 text-amber-600 dark:text-amber-400">
                <i class="pi pi-exclamation-circle text-base"></i>
            </div>
            <div class="min-w-0">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold uppercase text-amber-700 dark:text-amber-300">Action requise</span>
                    <span class="inline-flex items-center px-1.5 py-0.2 rounded-full text-[11px] font-bold bg-amber-500 text-white">
                        {{ countNcATraiter }}
                    </span>
                </div>
                <p class="text-xs text-surface-600 dark:text-surface-300 truncate">
                    Non-conformité{{ countNcATraiter > 1 ? 's' : '' }} en attente de traitement
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
            <a [routerLink]="['/non-conformite/traitement']" 
               class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-medium text-amber-700 dark:text-amber-300 bg-amber-500/15 hover:bg-amber-500/25 dark:bg-amber-500/20 dark:hover:bg-amber-500/30 transition-colors no-underline">
                <span>Traiter</span>
                <i class="pi pi-arrow-right text-[10px]"></i>
            </a>
            <button (click)="closedNc = true" 
                    type="button" 
                    class="w-6 h-6 rounded-md flex items-center justify-center text-surface-400 hover:text-surface-600 dark:hover:text-surface-200 hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer border-none bg-transparent"
                    title="Fermer">
                <i class="pi pi-times text-[10px]"></i>
            </button>
        </div>
    </div>

    <!-- Alerte 2 : Plans d'action à traiter -->
    <div *ngIf="!closedPlans && countPlansATraiter > 0" 
         class="relative flex items-center justify-between gap-3 px-4 py-2.5 rounded-xl border border-sky-500/20 bg-gradient-to-r from-sky-500/10 via-sky-500/5 to-transparent dark:border-sky-500/30 dark:from-sky-500/15 backdrop-blur-sm shadow-xs transition-all duration-300">
        
        <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-sky-500/20 dark:bg-sky-500/30 flex items-center justify-center shrink-0 text-sky-600 dark:text-sky-400">
                <i class="pi pi-file-edit text-base"></i>
            </div>
            <div class="min-w-0">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold uppercase text-sky-700 dark:text-sky-300">Plan d'action</span>
                    <span class="inline-flex items-center px-1.5 py-0.2 rounded-full text-[11px] font-bold bg-sky-500 text-white">
                        {{ countPlansATraiter }}
                    </span>
                </div>
                <p class="text-xs text-surface-600 dark:text-surface-300 truncate">
                    Plan{{ countPlansATraiter > 1 ? 's' : '' }} d'action à réaliser
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
            <a [routerLink]="['/non-conformite/plan-action']" 
               class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-medium text-sky-700 dark:text-sky-300 bg-sky-500/15 hover:bg-sky-500/25 dark:bg-sky-500/20 dark:hover:bg-sky-500/30 transition-colors no-underline">
                <span>Consulter</span>
                <i class="pi pi-arrow-right text-[10px]"></i>
            </a>
            <button (click)="closedPlans = true" 
                    type="button" 
                    class="w-6 h-6 rounded-md flex items-center justify-center text-surface-400 hover:text-surface-600 dark:hover:text-surface-200 hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer border-none bg-transparent"
                    title="Fermer">
                <i class="pi pi-times text-[10px]"></i>
            </button>
        </div>
    </div>
</div>
