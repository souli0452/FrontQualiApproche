<!-- ====================================================================
     2. SECTION DASHBOARD RQ
     ==================================================================== -->
<div class="grid grid-cols-1 xl:grid-cols-12 gap-6 mt-2 m4-4" *ngIf="roleService.isAdmin || roleService.isRQ">
    <!-- SECTION GAUCHE : Les 4 blocs de statistiques (ACTIFS) -->
    <div class="xl:col-span-7 grid grid-cols-1 sm:grid-cols-2 gap-5" *ngIf="roleService.isRQ">
        <app-card-stats-admin 
            *ngFor="let card of dashboardCardsRQ"
            [label]="card.label"
            [value]="card.isCustomValue 
                ? (countNonConformiteCloturee || 0) 
                : (stats?.[card.valueKey] || 0)"
            [color]="card.color"
            [icon]="card.icon"
            [title]="card.badge"
            [description]="card.description"
            [loading]="loading"
            [progressionItems]="card.hasExtra ? [
                { label: 'Validation Pilote', value: countValidationPilote, icon: 'pi pi-check-circle' },
                { label: 'Validation RQ', value: countValidationRQ, icon: 'pi pi-check-circle' }
            ] : []">
        </app-card-stats-admin>
    </div>

<!-- ====================================================================
     4. SECTION DASHBOARD AGENT (ACTIFS)
     ==================================================================== -->
<div class="grid grid-cols-12 gap-4 my-4" *ngIf="roleService.isAgent">
    <div *ngFor="let card of dashboardCardsAgent" class="col-span-12 md:col-span-6 xl:col-span-3">
        <app-card-stats-admin
            [label]="card.label"
            [loading]="loading"
            [value]="stats?.[card.valueKey] || 0"
            [icon]="card.icon"
            [color]="card.color"
            [title]="card.badge"
            [description]="card.description">
        </app-card-stats-admin>
    </div>
</div>
